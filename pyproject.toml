[project]
name = "document-extractor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.34,<4",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "typesafe-sdk>=0.7.5,<0.8",
]

[project.scripts]
# `uv run document-extractor ...` calls this function; its return value is the exit code (D28).
document-extractor = "document_extractor.cli:main"

# A build system makes uv install the project itself, which is what puts the
# `document-extractor` command on the path. uv's own backend; no setuptools.
[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package sits at the repo root, not under the backend's default src/.
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
# Lets tests import the `document_extractor` package from the repo root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
